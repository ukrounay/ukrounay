    <style>
        @font-face { font-family: Elemental; font-weight: normal;   src: url(elemental.ttf); }
        @font-face { font-family: Elemental; font-weight: bold;     src: url(elemental-black.ttf); }
        * {
            font-family: Elemental, 'Courier New', Courier, monospace !important;
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        .row {
            width: 100%;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;

            display: flex;
            flex-direction: row;
            gap: 2rem;
        }
        .window {
            border-radius: 20px;
            width: 100%;
            position: relative;
            overflow: hidden;
            border: 1px solid black;
        }
        #customBackground {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            z-index: -1;
        }
        .windowBar {
            font-weight: normal;
            padding: 0.5rem 2rem;
            border-bottom: 1px solid black;
        }
        .windowContent {
            padding: 2rem;
        }
        @media screen and (max-width: 800px) {
            .row {
                flex-direction: column;
                padding: 0 1rem;
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
</head>

<script>
